name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read

# Never run two of the same ref at once; cancel an in-flight run if a newer one lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on every push and PR — a broken `zola build` fails here and blocks deploy.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with theme submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zola
        env:
          ZOLA_VERSION: "0.21.0" # keep in sync with flake.nix
        run: |
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo install -m 0755 zola /usr/local/bin/zola
          zola --version

      - name: Build
        run: zola build

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public
          retention-days: 7

  # Only on main (or a manual run) — never on PRs — and only if `build` succeeded.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: public
          path: public

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=simaojunior --branch=main
